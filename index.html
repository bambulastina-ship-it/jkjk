<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Malwa Belt Renovations Ltd. | Renovation Contractors</title>
    <meta
      name="description"
      content="Malwa Belt Renovations Ltd. — licensed and insured renovation contractors. Basements, kitchens, bathrooms, framing, drywall and finishing. Call +1 (365) 440-3466 for a free quote."
    />
    <meta name="theme-color" content="#0B2545" />
    <link rel="icon" href="/assets/logo.jpg" />
    <link rel="canonical" href="https://malwabeltrenovations.ca/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Malwa Belt Renovations Ltd." />
    <meta property="og:description" content="Licensed and insured renovation contractors. Free quotes — call +1 (365) 440-3466." />
    <meta property="og:image" content="/assets/project-1.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GeneralContractor",
        "name": "Malwa Belt Renovations Ltd.",
        "telephone": "+1-365-440-3466",
        "url": "https://malwabeltrenovations.ca/",
        "image": "/assets/logo.jpg",
        "sameAs": ["https://www.instagram.com/malwabeltrenovations/"],
        "address": { "@type": "PostalAddress", "addressRegion": "ON", "addressCountry": "CA" },
        "areaServed": "Greater Toronto & Hamilton Area",
        "priceRange": "$$"
      }
    </script>
  </head>
  <body>
    <!-- Boot loader: painted with the first frame of HTML so the navy screen and
         the construction animation are genuinely the first thing visible. React
         removes this node when its own Loader mounts, and times the reveal from
         __bootAt so the loader is on screen for exactly 3s from first paint. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 400; display: grid; place-content: center;
              justify-items: center; gap: 24px; background: #0b2545; padding: 24px; }
      #boot svg { width: clamp(84px, 22vw, 108px); }
      #boot svg > * { stroke: #f2a900; stroke-width: 3; stroke-linecap: round;
                      stroke-linejoin: round; fill: none; }
      #boot p { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px;
                font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
                color: rgba(255,255,255,0.65); margin: 0; }
    </style>
    <div id="boot" role="status" aria-label="Loading">
      <svg viewBox="0 0 120 96" aria-hidden="true">
        <line x1="12" y1="88" x2="108" y2="88" />
        <polyline points="24,88 24,46 60,18 96,46 96,88" />
      </svg>
      <p>Malwa Belt Renovations</p>
    </div>
    <script>window.__bootAt = Date.now()</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
